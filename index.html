<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe3ee">
<title>🧶 我的钩织记录</title>
<style>
  :root{
    --pink:#ff8fb1;
    --pink-deep:#f0678f;
    --pink-soft:#ffe3ee;
    --bg:#fff6fa;
    --card:#ffffff;
    --text:#5c4550;
    --muted:#b294a2;
    --line:#ffe7f0;
    --radius:20px;
    --action-w:140px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:#f4e7ee;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    background:var(--bg);
    overflow:hidden;
  }

  .page{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    background:var(--bg);
  }
  .page.active{ display:flex; animation:pageIn .26s ease both; }

  @keyframes pageIn{
    from{ opacity:0; transform:translateX(14px); }
    to{ opacity:1; transform:translateX(0); }
  }

  /* ============ 列表页 ============ */
  .app-header{
    padding: calc(env(safe-area-inset-top) + 26px) 22px 24px;
    background:linear-gradient(150deg,#ffd6e7 0%,#ffeaf3 58%,#fff6fa 100%);
    border-radius:0 0 28px 28px;
    flex:0 0 auto;
  }
  .app-header h1{
    margin:0;
    font-size:24px;
    color:#c9486f;
    letter-spacing:1.5px;
    font-weight:700;
  }
  .app-header p{
    margin:7px 0 0;
    font-size:13px;
    color:#d98cab;
    letter-spacing:.5px;
  }

  .list-body{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:20px 16px 8px;
  }

  .swipe-wrap{
    position:relative;
    margin-bottom:14px;
    border-radius:var(--radius);
    overflow:hidden;
    background:#fff;
    box-shadow:0 5px 18px rgba(255,150,185,.14);
  }

  .swipe-actions{
    position:absolute;
    top:0; right:0; bottom:0;
    display:flex;
    z-index:0;
  }
  .act{
    width:70px;
    border:none;
    color:#fff;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
  }
  .act.rename{ background:#ffb8ce; }
  .act.delete{ background:#ff7096; }
  .act:active{ filter:brightness(.94); }

  .card{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    background:#fff;
    will-change:transform;
    touch-action:pan-y;
  }

  .p-icon{
    flex:0 0 auto;
    width:48px; height:48px;
    border-radius:16px;
    background:linear-gradient(135deg,#ffe9f3,#ffd2e4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
  }

  .p-info{ flex:1 1 auto; min-width:0; }

  .p-name{
    font-size:16px;
    font-weight:600;
    color:#5c4550;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-rows{
    margin-top:5px;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .p-rows b{ color:#ff7aa6; font-size:15px; font-weight:700; }

  .edit-btn{
    flex:0 0 auto;
    border:none;
    font-family:inherit;
    padding:9px 16px;
    border-radius:14px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(135deg,#ffb3cf,#ff8fb1);
    box-shadow:0 4px 12px rgba(255,143,177,.38);
    transition:transform .12s;
  }
  .edit-btn:active{ transform:scale(.93); }

  .empty{
    text-align:center;
    padding:70px 20px;
    color:#c8a5b5;
  }
  .empty-icon{ font-size:52px; margin-bottom:14px; }
  .empty p{ margin:0; font-size:14px; line-height:1.9; }

  .list-footer{
    flex:0 0 auto;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(to top,#fff6fa 62%,rgba(255,246,250,0));
  }
  #newProjectBtn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:20px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#fff;
    background:linear-gradient(135deg,#ffa5c6,#ff7ba9);
    box-shadow:0 8px 22px rgba(255,123,169,.4);
    transition:transform .12s;
  }
  #newProjectBtn:active{ transform:scale(.975); }

  /* ============ 详情页 ============ */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 14px;
    background:linear-gradient(150deg,#ffd6e7,#ffeaf3);
    border-radius:0 0 22px 22px;
  }
  .topbar h2{
    flex:1 1 auto;
    margin:0;
    font-size:17px;
    font-weight:700;
    color:#c9486f;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    flex:0 0 auto;
    width:38px; height:38px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.78);
    color:#e2678f;
    font-size:24px;
    line-height:1;
    padding-bottom:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
  }
  .icon-btn:active{ background:#fff; }
  .save-btn{
    flex:0 0 auto;
    border:none;
    font-family:inherit;
    padding:9px 17px;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(135deg,#ffa5c6,#ff7ba9);
    box-shadow:0 4px 12px rgba(255,123,169,.35);
    transition:transform .12s;
  }
  .save-btn:active{ transform:scale(.94); }

  .detail-content{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }

  .chart-card{
    flex:0 0 auto;
    margin:14px 16px 0;
    background:#fff;
    border-radius:22px;
    box-shadow:0 5px 18px rgba(255,143,177,.12);
    overflow:hidden;
  }
  .chart-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:13px 14px 11px;
  }
  .chart-title{
    flex:1 1 auto;
    min-width:0;
    font-size:13.5px;
    font-weight:700;
    color:#c9486f;
    letter-spacing:.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chart-title b{ color:#ff6b9d; font-size:15px; }
  .chart-tools{ display:flex; gap:6px; flex:0 0 auto; }
  .mini-btn{
    border:none;
    font-family:inherit;
    font-size:11.5px;
    font-weight:600;
    padding:7px 11px;
    border-radius:11px;
    background:#fff0f6;
    color:#e2678f;
    letter-spacing:.5px;
    transition:transform .12s, background .18s;
  }
  .mini-btn:active{ background:#ffe0ee; transform:scale(.95); }

  .chart-body{
    padding:0 14px 14px;
    max-height:34vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .chart-body img{
    width:100%;
    max-height:30vh;
    object-fit:contain;
    display:block;
    border-radius:14px;
    background:#fff6fa;
  }
  .chart-text{
    background:#fff6fa;
    border-radius:14px;
    padding:13px 15px;
    font-size:14px;
    line-height:1.85;
    color:#5c4550;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .chart-empty{
    text-align:center;
    padding:26px 12px;
    color:#d3b2c1;
    font-size:13px;
    line-height:1.9;
    background:#fffafc;
    border-radius:14px;
  }
  .chart-empty span{ font-size:11.5px; color:#e0c3d0; }

  .detail-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 30px);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .counter-card{
    background:#fff;
    border-radius:26px;
    padding:22px 20px 24px;
    text-align:center;
    box-shadow:0 8px 26px rgba(255,143,177,.16);
    flex:0 0 auto;
  }
  .counter-label{
    font-size:13px;
    letter-spacing:2px;
    color:#cba3b3;
  }
  .counter{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .counter button{
    width:66px; height:66px;
    flex:0 0 auto;
    border:none;
    border-radius:50%;
    font-family:inherit;
    font-size:32px;
    font-weight:300;
    line-height:1;
    color:#fff;
    background:linear-gradient(135deg,#ffa5c3,#ff85ae);
    box-shadow:0 7px 16px rgba(255,133,174,.42);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s;
  }
  .counter button:active{ transform:scale(.9); }

  .row-num{
    flex:1 1 auto;
    font-size:60px;
    font-weight:800;
    color:#ff6b9d;
    line-height:1;
    display:flex;
    align-items:baseline;
    justify-content:center;
    letter-spacing:-1px;
  }
  .row-num small{
    font-size:16px;
    font-weight:600;
    color:#d3a8b8;
    margin-left:5px;
    letter-spacing:0;
  }
  .row-num.bump{ animation:bump .26s ease; }
  @keyframes bump{
    0%{ transform:scale(1); }
    42%{ transform:scale(1.14); }
    100%{ transform:scale(1); }
  }

  .note-card,
  .history-card{
    background:#fff;
    border-radius:22px;
    padding:16px 16px 14px;
    box-shadow:0 5px 18px rgba(255,143,177,.12);
    flex:0 0 auto;
  }
  .card-title{
    font-size:13.5px;
    font-weight:700;
    color:#c9486f;
    letter-spacing:1px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .card-title .tip{
    font-size:11px;
    font-weight:500;
    color:#d3b2c1;
    letter-spacing:0;
  }
  #noteInput{
    width:100%;
    min-height:96px;
    resize:none;
    border:none;
    outline:none;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.75;
    color:#5c4550;
    background:#fff6fa;
    border-radius:16px;
    padding:13px 14px;
    display:block;
  }
  #noteInput::placeholder{ color:#d9bfcb; }

  .hist-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px 12px 12px;
    margin:0 -4px;
    border-radius:14px;
    border-bottom:1px dashed var(--line);
    font-size:14px;
    transition:background .18s, transform .12s;
    cursor:pointer;
  }
  .hist-item:last-child{ border-bottom:none; }
  .hist-item:active{
    background:#fff0f6;
    transform:scale(.985);
  }

  .hist-row{
    flex:0 0 auto;
    font-size:12.5px;
    font-weight:700;
    color:#ff7fa8;
    background:#ffe9f2;
    padding:3px 10px;
    border-radius:11px;
    letter-spacing:.5px;
  }
  .hist-note{
    flex:1 1 auto;
    min-width:0;
    color:#8a7280;
    line-height:1.6;
    word-break:break-word;
    padding-top:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hist-note i{ color:#d9bfcb; font-style:normal; }

  .hist-arrow{
    flex:0 0 auto;
    color:#e5c4d3;
    font-size:16px;
    line-height:1;
    padding-bottom:2px;
  }

  .empty-small{
    text-align:center;
    color:#d0b3c1;
    font-size:13px;
    padding:18px 0 10px;
  }

  /* ============ 弹窗 ============ */
  .modal{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(120,70,95,.32);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .modal.show{ display:flex; animation:fadeIn .18s ease both; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .modal-box{
    width:100%;
    max-width:360px;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#fff;
    border-radius:26px;
    padding:22px 20px 18px;
    box-shadow:0 20px 50px rgba(150,80,110,.24);
    animation:popIn .24s cubic-bezier(.2,1.3,.5,1) both;
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.9) translateY(10px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .modal-box h3{
    margin:0 0 16px;
    font-size:17px;
    color:#c9486f;
    text-align:center;
    letter-spacing:1px;
  }
  #modalInput{
    width:100%;
    padding:13px 15px;
    border:1.5px solid var(--line);
    border-radius:15px;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    outline:none;
    background:#fff8fb;
    transition:border-color .2s;
  }
  #modalInput:focus{ border-color:#ffb3cf; }
  #modalInput::placeholder{ color:#d9bfcb; }

  .icon-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:14px;
  }
  .icon-opt{
    aspect-ratio:1/1;
    border:none;
    border-radius:13px;
    background:#fff5f9;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .12s, background .18s;
    font-family:inherit;
  }
  .icon-opt.sel{
    background:linear-gradient(135deg,#ffd6e7,#ffb8d3);
    box-shadow:0 0 0 2px #ff9dc0 inset;
    transform:scale(1.04);
  }

  .collapse-toggle{
    width:100%;
    margin-top:14px;
    border:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    color:#e2678f;
    background:#fff4f9;
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background .18s;
  }
  .collapse-toggle:active{ background:#ffe9f3; }
  .collapse-toggle .arrow{
    transition:transform .25s;
    font-size:11px;
    color:#d98cab;
  }
  .collapse-toggle.open .arrow{ transform:rotate(180deg); }

  .chart-import{
    display:none;
    margin-top:12px;
    padding:14px;
    background:#fffafc;
    border-radius:18px;
  }
  .chart-import.show{ display:block; animation:fadeIn .2s ease both; }

  .import-hint{
    font-size:11.5px;
    color:#c8a5b5;
    line-height:1.7;
    margin:0 0 10px;
  }

  .import-row{ display:flex; gap:8px; }
  .import-btn{
    flex:1 1 0;
    border:none;
    font-family:inherit;
    padding:11px 6px;
    border-radius:14px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.5px;
    background:#fff0f6;
    color:#e2678f;
    transition:transform .12s, background .18s;
  }
  .import-btn:active{ background:#ffe0ee; transform:scale(.97); }

  .chart-preview{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    max-height:158px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .chart-preview.show{ display:flex; }

  .thumb{
    position:relative;
    width:54px; height:54px;
    border-radius:13px;
    overflow:hidden;
    background:#fff0f6;
    flex:0 0 auto;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb span{
    position:absolute;
    left:3px; bottom:3px;
    background:rgba(201,72,111,.86);
    color:#fff;
    font-size:9.5px;
    padding:1px 5px;
    border-radius:7px;
  }

  .text-chip{
    font-size:11.5px;
    padding:7px 11px;
    border-radius:11px;
    background:#fff0f6;
    color:#c9486f;
    flex:0 0 auto;
  }

  .chart-textarea{
    width:100%;
    min-height:86px;
    resize:none;
    margin-top:10px;
    border:1.5px solid var(--line);
    border-radius:15px;
    font-family:inherit;
    font-size:13.5px;
    line-height:1.75;
    color:var(--text);
    background:#fff8fb;
    padding:12px 13px;
    outline:none;
    display:none;
  }
  .chart-textarea.show{ display:block; }
  .chart-textarea:focus{ border-color:#ffb3cf; }
  .chart-textarea::placeholder{ color:#d9bfcb; }

  .modal-textarea{
    width:100%;
    min-height:118px;
    resize:none;
    border:1.5px solid var(--line);
    border-radius:15px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.75;
    color:var(--text);
    background:#fff8fb;
    padding:12px 14px;
    outline:none;
  }
  .modal-textarea:focus{ border-color:#ffb3cf; }
  .modal-textarea::placeholder{ color:#d9bfcb; }

  .confirm-text{
    margin:0 0 20px;
    font-size:14.5px;
    color:#8a7280;
    text-align:center;
    line-height:1.7;
  }

  .modal-actions{
    display:flex;
    gap:9px;
    margin-top:20px;
  }
  .modal-actions button{
    flex:1 1 0;
    padding:13px 4px;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.5px;
    transition:transform .12s;
  }
  .modal-actions button:active{ transform:scale(.96); }
  .btn-ghost{ background:#fff0f6; color:#c48da4; }
  .btn-primary{
    background:linear-gradient(135deg,#ffa5c6,#ff7ba9);
    color:#fff;
    box-shadow:0 6px 16px rgba(255,123,169,.38);
  }
  .btn-danger{
    background:linear-gradient(135deg,#ff8fa8,#ff6488);
    color:#fff;
    box-shadow:0 6px 16px rgba(255,100,136,.38);
  }

  /* ============ 历史明细弹窗（可编辑） ============ */
  .hist-detail-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .hist-detail-badge{
    flex:0 0 auto;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,#ffb3cf,#ff8fb1);
    padding:6px 15px;
    border-radius:14px;
    letter-spacing:.5px;
    box-shadow:0 4px 12px rgba(255,143,177,.35);
  }
  .hist-detail-time{
    flex:1 1 auto;
    font-size:11.5px;
    color:#cba3b3;
    text-align:right;
    line-height:1.5;
  }

  .hist-field-label{
    font-size:12px;
    font-weight:700;
    color:#c9486f;
    letter-spacing:.8px;
    margin:0 0 7px 2px;
    display:flex;
    align-items:center;
    gap:5px;
  }

  /* 可编辑的备注框 */
  #histDetailNote{
    width:100%;
    min-height:88px;
    max-height:32vh;
    resize:none;
    border:1.5px solid var(--line);
    border-radius:16px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.8;
    color:#5c4550;
    background:#fff8fb;
    padding:12px 14px;
    outline:none;
    display:block;
    transition:border-color .2s;
    -webkit-overflow-scrolling:touch;
  }
  #histDetailNote:focus{ border-color:#ffb3cf; background:#fff; }
  #histDetailNote::placeholder{ color:#d9bfcb; }

  /* 图解编辑区 */
  .hist-chart-block{
    margin-top:14px;
    padding:13px 13px 12px;
    background:#fffafc;
    border-radius:18px;
  }

  .hist-chart-actions{
    display:flex;
    gap:7px;
    margin-bottom:10px;
  }
  .hist-chart-btn{
    flex:1 1 0;
    border:none;
    font-family:inherit;
    padding:10px 5px;
    border-radius:12px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.5px;
    background:#fff0f6;
    color:#e2678f;

  #histChartPreview{

  #histChartPreview .chart-text-inner{

    text-align:center;

    font-size:12.5px;

  /* ============ Toast ============ */
  .toast{
    position:fixed;
    left:50%;
    bottom:88px;
    z-index:500;
    padding:11px 22px;
    border-radius:22px;
    background:rgba(105,62,82,.9);
    color:#fff;
    font-size:13.5px;
    letter-spacing:.5px;
    white-space:nowrap;
    opacity:0;
    transform:translateX(-50%) translateY(12px);
    transition:opacity .26s, transform .26s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'crochet_records_v1';
  const ICONS = ['🧶','🌸','🐻','🍓','🐰','🌈','🎀','🍑','🐱','☁️','🌷','🧸','🦄','🍰','💐','🐳','🍒','⭐'];
  const ACTION_W = 140;
  const MAX_IMAGES = 50;

  let projects = [];
  let currentId = null;
  let openCardEl = null;

  let modalMode = 'create';
  let editingId = null;
  let selectedIcon = ICONS[0];
  let pendingDeleteId = null;

  let pendingImages = [];
  let pendingTextLines = [];

  let textChartRow = null;

  /* 正在编辑的历史记录 */
  let editingHistIndex = -1;
  let editingHistChart = null;   // 编辑中的图解（克隆副本）

  let quotaWarned = false;

  const $ = id => document.getElementById(id);

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  let toastTimer = null;
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  function fmtTime(ts){
    if(!ts) return '';
    const d = new Date(ts);
    const p = n => (n < 10 ? '0' + n : '' + n);
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function cloneChart(c){
    if(!c) return null;
    if(c.type === 'image') return { type:'image', src:c.src };
    if(c.type === 'text')  return { type:'text',  text:c.text };
    return null;
  }

  function compressImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      if(!file || !/^image\//.test(file.type)){
        reject(new Error('不是图片文件'));
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          let w = img.width || 1;
          let h = img.height || 1;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          if(h > maxW * 1.6){ w = Math.round(w * (maxW * 1.6) / h); h = Math.round(maxW * 1.6); }
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, w);
          canvas.height = Math.max(1, h);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try{
            resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
          }catch(err){
            reject(err);
          }
        };
        img.onerror = function(){ reject(new Error('图片解析失败')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('文件读取失败')); };
      reader.readAsDataURL(file);
    });
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      projects = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(projects)) projects = [];
    }catch(e){
      projects = [];
    }
    projects.forEach(function(p){
      p.history = Array.isArray(p.history) ? p.history : [];
      p.charts = Array.isArray(p.charts) ? p.charts : [];
      p.row = Math.max(1, parseInt(p.row, 10) || 1);
      p.note = p.note || '';
      p.icon = p.icon || '🧶';

      p.history.forEach(function(h){
        if(typeof h.chart === 'undefined') h.chart = null;
      });
    });
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      return true;
    }catch(e){
      if(!quotaWarned){
        quotaWarned = true;
        toast('存储空间不足，请减少图片图解 😢');
        setTimeout(function(){ quotaWarned = false; }, 4000);
      }
      return false;
    }
  }

  const getProject = id => projects.find(p => p.id === id);

  const chartCount = p => (p.charts || []).filter(Boolean).length;

  /* ================== 左滑逻辑 ================== */
  function setSwipe(card, open){
    if(!card) return;
    card.style.transition = 'transform .26s cubic-bezier(.2,.8,.3,1)';
    card.style.transform = open ? 'translateX(' + (-ACTION_W) + 'px)' : 'translateX(0)';
    card._open = open;
    if(open){
      if(openCardEl && openCardEl !== card){
        openCardEl.style.transition = 'transform .26s cubic-bezier(.2,.8,.3,1)';
        openCardEl.style.transform = 'translateX(0)';
        openCardEl._open = false;
      }
      openCardEl = card;
    }else if(openCardEl === card){
      openCardEl = null;
    }
  }

  function closeAllSwipe(){
    if(openCardEl) setSwipe(openCardEl, false);
  }

  function attachSwipe(card){
    let startX = 0, startY = 0, baseX = 0, dx = 0, locked = null;

    card.addEventListener('touchstart', function(e){
      if(e.touches.length > 1) return;
      if(openCardEl && openCardEl !== card) setSwipe(openCardEl, false);
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      baseX = card._open ? -ACTION_W : 0;
      dx = baseX;
      locked = null;
      card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', function(e){
      if(e.touches.length > 1) return;
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const ddx = x - startX;
      const ddy = y - startY;

      if(locked === null){
        if(Math.abs(ddx) > 8 || Math.abs(ddy) > 8){
          locked = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
        }else{
          return;
        }
      }
      if(locked !== 'x') return;

      e.preventDefault();
      let val = baseX + ddx;
      if(val > 0) val = 0;
      if(val < -ACTION_W) val = -ACTION_W;
      dx = val;
      card.style.transform = 'translateX(' + val + 'px)';
    }, { passive: false });

    function endSwipe(){
      if(locked !== 'x') dx = baseX;
      setSwipe(card, dx < -ACTION_W / 2);
    }
    card.addEventListener('touchend', endSwipe);
    card.addEventListener('touchcancel', endSwipe);
  }

  /* ================== 列表渲染 ================== */
  function renderList(){
    const list = $('projectList');
    list.innerHTML = '';
    openCardEl = null;

    if(!projects.length){
      list.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon">🧺</div>' +
          '<p>还没有钩织项目<br>点击下方按钮开始第一个吧 🌸</p>' +
        '</div>';
      return;
    }

    projects.forEach(function(p){
      const wrap = document.createElement('div');
      wrap.className = 'swipe-wrap';

      const actions = document.createElement('div');
      actions.className = 'swipe-actions';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'act rename';
      renameBtn.type = 'button';
      renameBtn.textContent = '重命名';
      renameBtn.addEventListener('click', function(){
        setSwipe(card, false);
        openRenameModal(p.id);
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'act delete';
      delBtn.type = 'button';
      delBtn.textContent = '删除';
      delBtn.addEventListener('click', function(){
        setSwipe(card, false);
        askDelete(p.id);
      });

      actions.appendChild(renameBtn);
      actions.appendChild(delBtn);

      const card = document.createElement('div');
      card.className = 'card';
      card._open = false;

      const cc = chartCount(p);
      const chartInfo = cc ? ' · 📖 ' + cc + ' 行图解' : '';

      card.innerHTML =
        '<div class="p-icon">' + esc(p.icon) + '</div>' +
        '<div class="p-info">' +
          '<div class="p-name">' + esc(p.name) + '</div>' +
          '<div class="p-rows">当前 <b>' + p.row + '</b> 行' + chartInfo + '</div>' +
        '</div>' +
        '<button class="edit-btn" type="button">编辑</button>';

      card.addEventListener('click', function(e){
        if(card._open){
          setSwipe(card, false);
          return;
        }
        if(e.target.closest('.edit-btn') || e.target.closest('.p-info') ||
           e.target.closest('.p-icon') || e.target === card){
          openProject(p.id);
        }
      });

      wrap.appendChild(actions);
      wrap.appendChild(card);
      list.appendChild(wrap);

      attachSwipe(card);
    });
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest('.swipe-wrap')){
      closeAllSwipe();
    }
  }, false);

  /* ================== 新建 / 重命名 弹窗 ================== */
  function buildIconGrid(){
    const grid = $('iconGrid');
    grid.innerHTML = ICONS.map(function(ic, i){
      return '<button type="button" class="icon-opt' + (i === 0 ? ' sel' : '') +
             '" data-icon="' + ic + '">' + ic + '</button>';
    }).join('');

    grid.addEventListener('click', function(e){
      const btn = e.target.closest('.icon-opt');
      if(!btn) return;
      grid.querySelectorAll('.icon-opt').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      selectedIcon = btn.dataset.icon;
    });
  }

  function renderChartPreview(){
    const box = $('chartPreview');
    let html = '';

    if(pendingImages.length){
      pendingImages.forEach(function(src, i){
        html += '<div class="thumb"><img src="' + src + '" alt=""><span>' + (i + 1) + '</span></div>';
      });
    }else if(pendingTextLines.length){
      pendingTextLines.forEach(function(t, i){
        const short = t.length > 7 ? t.slice(0, 7) + '…' : t;
        html += '<div class="text-chip">第' + (i + 1) + '行 · ' + esc(short) + '</div>';
      });
    }

    if(html){
      box.innerHTML = html;
      box.classList.add('show');
    }else{
      box.innerHTML = '';
      box.classList.remove('show');
    }

    const n = pendingImages.length || pendingTextLines.length;
    $('chartToggleText').textContent = n
      ? '🧵 已导入 ' + n + ' 行图解'
      : '🧵 导入钩织图解（可选）';
  }

  function resetPendingCharts(){
    pendingImages = [];
    pendingTextLines = [];
    $('chartTextInput').value = '';
    $('chartPreview').innerHTML = '';
    $('chartPreview').classList.remove('show');
    $('chartToggleText').textContent = '🧵 导入钩织图解（可选）';
    $('chartToggle').classList.remove('open');
    $('chartImportArea').classList.remove('show');
    $('chartTextInput').classList.remove('show');
  }

  function openCreateModal(){
    modalMode = 'create';
    editingId = null;
    selectedIcon = ICONS[0];

    $('modalTitle').textContent = '新建钩织项目';
    $('modalOk').textContent = '创建';
    $('chartToggle').style.display = 'flex';

    const input = $('modalInput');
    input.value = '';
    input.placeholder = '给项目起个名字吧～';

    const grid = $('iconGrid');
    grid.querySelectorAll('.icon-opt').forEach(function(b, i){
      b.classList.toggle('sel', i === 0);
    });

    resetPendingCharts();

    $('modal').classList.add('show');
    setTimeout(function(){ input.focus(); }, 120);
  }

  function openRenameModal(id){
    const p = getProject(id);
    if(!p) return;
    modalMode = 'rename';
    editingId = id;

    $('modalTitle').textContent = '重命名项目';
    $('modalOk').textContent = '保存';
    $('chartToggle').style.display = 'none';
    $('chartImportArea').classList.remove('show');

    const input = $('modalInput');
    input.value = p.name;
    input.placeholder = '输入新的名称';

    $('modal').classList.add('show');
    setTimeout(function(){ input.focus(); input.select(); }, 120);
  }

  function closeModal(){
    $('modal').classList.remove('show');
    $('modalInput').blur();
    $('chartTextInput').blur();
  }

  $('chartToggle').addEventListener('click', function(){
    const area = $('chartImportArea');
    const open = area.classList.toggle('show');
    this.classList.toggle('open', open);
  });

  $('pickImagesBtn').addEventListener('click', function(){
    $('chartFileInput').click();
  });

  $('chartFileInput').addEventListener('change', function(e){
    const input = this;
    const files = Array.prototype.slice.call(e.target.files || []);
    input.value = '';
    if(!files.length) return;

    toast('正在处理图片…');

    const tasks = files.map(function(f){
      return compressImage(f, 720, 0.72).catch(function(){ return null; });
    });

    Promise.all(tasks).then(function(results){
      const ok = results.filter(Boolean);
      if(!ok.length){
        toast('图片处理失败，请换一张试试');
        return;
      }
      pendingTextLines = [];
      $('chartTextInput').value = '';
      $('chartTextInput').classList.remove('show');

      pendingImages = pendingImages.concat(ok);
      if(pendingImages.length > MAX_IMAGES){
        pendingImages = pendingImages.slice(0, MAX_IMAGES);
      }
      renderChartPreview();
      toast('已添加 ' + ok.length + ' 张图解 🌸');
    });
  });

  $('pickTextBtn').addEventListener('click', function(){
    const ta = $('chartTextInput');
    ta.classList.add('show');
    if(pendingImages.length){
      pendingImages = [];
      renderChartPreview();
    }
    ta.focus();
  });

  $('chartTextInput').addEventListener('input', function(){
    const lines = this.value.split('\n')
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; });

    if(lines.length){
      pendingImages = [];
    }
    pendingTextLines = lines;
    renderChartPreview();
  });

  $('modalCancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function(e){
    if(e.target === $('modal')) closeModal();
  });

  $('modalOk').addEventListener('click', function(){
    const name = $('modalInput').value.trim();

    if(modalMode === 'create'){
      let charts = [];
      if(pendingImages.length){
        charts = pendingImages.map(function(src){
          return { type: 'image', src: src };
        });
      }else if(pendingTextLines.length){
        charts = pendingTextLines.map(function(t){
          return { type: 'text', text: t };
        });
      }

      projects.unshift({
        id: uid(),
        icon: selectedIcon,
        name: name || '未命名项目',
        row: 1,
        note: '',
        history: [],
        charts: charts
      });
      saveData();
      renderList();
      resetPendingCharts();
      closeModal();
      toast(charts.length ? '项目已创建，图解已导入 🎉' : '项目创建成功 🎉');
    }else{
      const p = getProject(editingId);
      if(p){
        p.name = name || p.name;
        saveData();
        renderList();
        if(currentId === p.id){
          $('detailTitle').textContent = p.name;
        }
        closeModal();
        toast('已重命名 ✨');
      }else{
        closeModal();
      }
    }
  });

  $('modalInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); $('modalOk').click(); }
  });

  /* ================== 删除确认 ================== */
  function askDelete(id){
    const p = getProject(id);
    if(!p) return;
    pendingDeleteId = id;
    $('confirmText').innerHTML =
      '确定要删除「<b>' + esc(p.name) + '</b>」吗？<br>删除后无法恢复哦～';
    $('confirmModal').classList.add('show');
  }

  $('confirmCancel').addEventListener('click', function(){
    $('confirmModal').classList.remove('show');
    pendingDeleteId = null;
  });

  $('confirmModal').addEventListener('click', function(e){
    if(e.target === $('confirmModal')){
      $('confirmModal').classList.remove('show');
      pendingDeleteId = null;
    }
  });

  $('confirmOk').addEventListener('click', function(){
    if(pendingDeleteId){
      projects = projects.filter(function(p){ return p.id !== pendingDeleteId; });
      saveData();
      renderList();
      toast('已删除');
    }
    pendingDeleteId = null;
    $('confirmModal').classList.remove('show');
  });

  /* ================== 详情页 ================== */
  function openProject(id){
    const p = getProject(id);
    if(!p) return;
    currentId = id;

    $('detailTitle').textContent = p.name;
    $('rowNum').textContent = p.row;
    $('noteInput').value = p.note || '';

    renderChart();
    renderHistory();

    $('listPage').classList.remove('active');
    $('detailPage').classList.add('active');

    const scroller = document.querySelector('.detail-scroll');
    if(scroller) scroller.scrollTop = 0;
    const chartBody = $('chartBody');
    if(chartBody) chartBody.scrollTop = 0;
  }

  function goBackToList(){
    saveCurrent(false);
    $('detailPage').classList.remove('active');
    $('listPage').classList.add('active');
    renderList();
  }

  function saveCurrent(showToast){
    const p = getProject(currentId);
    if(!p) return;
    p.note = $('noteInput').value;
    saveData();
    if(showToast) toast('已保存 ✨');
  }

  function renderChart(){
    const p = getProject(currentId);
    if(!p) return;

    const row = p.row;
    $('chartRowNum').textContent = row;

    const body = $('chartBody');
    const item = (p.charts || [])[row - 1];

    const emptyHtml =
      '<div class="chart-empty">这一行还没有图解 🌱<br>' +
      '<span>点击右上角「图片 / 文字」添加</span></div>';

    if(!item){
      body.innerHTML = emptyHtml;
    }else if(item.type === 'image' && item.src){
      body.innerHTML = '<img src="' + item.src + '" alt="第' + row + '行图解">';
    }else if(item.type === 'text' && item.text){
      body.innerHTML = '<div class="chart-text">' + esc(item.text) + '</div>';
    }else{
      body.innerHTML = emptyHtml;
    }

    body.scrollTop = 0;
  }

  function renderHistory(){
    const p = getProject(currentId);
    const box = $('historyList');
    if(!p || !p.history.length){
      box.innerHTML = '<div class="empty-small">还没有记录，点一下 ＋ / − 就开始啦 🌷</div>';
      return;
    }

    box.innerHTML = '';
    p.history.forEach(function(h, i){
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');

      const noteShort = h.note
        ? (h.note.length > 22 ? h.note.slice(0, 22) + '…' : h.note)
        : '<i>（无备注）</i>';

      item.innerHTML =
        '<span class="hist-row">第 ' + h.row + ' 行</span>' +
        '<span class="hist-note">' + (h.note ? esc(noteShort) : noteShort) + '</span>' +
        '<span class="hist-arrow">›</span>';

      item.addEventListener('click', function(){
        openHistEdit(i);
      });

      box.appendChild(item);
    });
  }

  /* ============ 历史明细：编辑模式 ============ */
  function renderHistChartPreview(){
    const box = $('histChartPreview');
    const c = editingHistChart;

    if(!c){
      box.innerHTML = '<div class="chart-empty-inner">暂无图解 🌱</div>';
      box.classList.add('show');
      return;
    }
    if(c.type === 'image' && c.src){
      box.innerHTML = '<img src="' + c.src + '" alt="图解">';
      box.classList.add('show');
    }else if(c.type === 'text' && c.text){
      box.innerHTML = '<div class="chart-text-inner">' + esc(c.text) + '</div>';
      box.classList.add('show');
    }else{
      box.innerHTML = '<div class="chart-empty-inner">暂无图解 🌱</div>';
      box.classList.add('show');
    }
  }

  function openHistEdit(index){
    const p = getProject(currentId);
    if(!p || !p.history[index]) return;
    const h = p.history[index];

    editingHistIndex = index;
    editingHistChart = cloneChart(h.chart);

    $('histDetailBadge').textContent = '第 ' + h.row + ' 行';
    $('histDetailTime').textContent = h.t ? fmtTime(h.t) : '';
    $('histDetailNote').value = h.note || '';

    renderHistChartPreview();

    $('histDetailModal').classList.add('show');
  }

  function closeHistDetail(){
    $('histDetailModal').classList.remove('show');
    editingHistIndex = -1;
    editingHistChart = null;
  }

  $('histDetailCancel').addEventListener('click', closeHistDetail);

  $('histDetailModal').addEventListener('click', function(e){
    if(e.target === $('histDetailModal')) closeHistDetail();
  });

  /* 保存历史编辑 */
  $('histDetailSave').addEventListener('click', function(){
    const p = getProject(currentId);
    if(!p || editingHistIndex < 0 || !p.history[editingHistIndex]){
      closeHistDetail();
      return;
    }

    const h = p.history[editingHistIndex];
    h.note = $('histDetailNote').value.trim();
    h.chart = cloneChart(editingHistChart);

    saveData();
    renderHistory();
    closeHistDetail();
    toast('已保存修改 ✨');
  });

  /* 历史图解：选图片 */
  $('histChartImgBtn').addEventListener('click', function(){
    $('histChartFileInput').click();
  });

  $('histChartFileInput').addEventListener('change', function(e){
    const input = this;
    const file = (e.target.files || [])[0];
    input.value = '';
    if(!file) return;

    toast('正在处理图片…');
    compressImage(file, 900, 0.75).then(function(src){
      editingHistChart = { type:'image', src:src };
      renderHistChartPreview();
      toast('已更换图解图片 📷');
    }).catch(function(){
      toast('图片处理失败，请换一张试试');
    });
  });

  /* 历史图解：文字 */
  $('histChartTextBtn').addEventListener('click', function(){
    const cur = editingHistChart;
    $('histTextChartInput').value = (cur && cur.type === 'text') ? cur.text : '';
    $('histTextChartModal').classList.add('show');
    setTimeout(function(){ $('histTextChartInput').focus(); }, 120);
  });

  $('histTextChartCancel').addEventListener('click', function(){
    $('histTextChartModal').classList.remove('show');
  });

  $('histTextChartModal').addEventListener('click', function(e){
    if(e.target === $('histTextChartModal')){
      $('histTextChartModal').classList.remove('show');
    }
  });

  $('histTextChartOk').addEventListener('click', function(){
    const val = $('histTextChartInput').value.trim();
    editingHistChart = val ? { type:'text', text:val } : null;
    renderHistChartPreview();
    $('histTextChartModal').classList.remove('show');
    toast(val ? '已更新文字图解 ✏️' : '已清除图解');
  });

  $('histTextChartInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      $('histTextChartOk').click();
    }
  });

  /* 历史图解：清除 */
  $('histChartClearBtn').addEventListener('click', function(){
    editingHistChart = null;
    renderHistChartPreview();
    toast('已清除图解');
  });

  function bumpNumber(){
    const el = $('rowNumWrap');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  /* 切换行数：保存当前状态到历史，清空备注 */
  function changeRow(delta){
    const p = getProject(currentId);
    if(!p) return;

    if(delta < 0 && p.row <= 1){
      toast('已经是第 1 行啦～');
      return;
    }

    const noteVal = $('noteInput').value;
    const currentChart = (p.charts || [])[p.row - 1] || null;

    p.history.unshift({
      row: p.row,
      note: noteVal.trim(),
      chart: cloneChart(currentChart),
      t: Date.now()
    });

    p.row = Math.max(1, p.row + delta);
    p.note = noteVal;

    $('rowNum').textContent = p.row;
    bumpNumber();

    $('noteInput').value = '';
    p.note = '';

    renderHistory();
    renderChart();
    saveData();
  }

  /* ---- 当前行图解：图片 ---- */
  $('chartImgBtn').addEventListener('click', function(){
    if(!currentId) return;
    $('detailFileInput').click();
  });

  $('detailFileInput').addEventListener('change', function(e){
    const input = this;
    const file = (e.target.files || [])[0];
    input.value = '';
    if(!file) return;

    const p = getProject(currentId);
    if(!p) return;

    toast('正在处理图片…');
    compressImage(file, 900, 0.75).then(function(src){
      if(!Array.isArray(p.charts)) p.charts = [];
      p.charts[p.row - 1] = { type: 'image', src: src };
      saveData();
      renderChart();
      toast('已添加第 ' + p.row + ' 行图解 📷');
    }).catch(function(){
      toast('图片处理失败，请换一张试试');
    });
  });

  /* ---- 当前行图解：文字 ---- */
  $('chartTextBtn').addEventListener('click', function(){
    const p = getProject(currentId);
    if(!p) return;
    textChartRow = p.row;
    const item = (p.charts || [])[p.row - 1];
    $('textChartTitle').textContent = '第 ' + p.row + ' 行 · 文字图解';
    $('textChartInput').value = (item && item.type === 'text') ? item.text : '';
    $('textChartModal').classList.add('show');
    setTimeout(function(){ $('textChartInput').focus(); }, 120);
  });

  $('textChartCancel').addEventListener('click', function(){
    $('textChartModal').classList.remove('show');
  });

  $('textChartModal').addEventListener('click', function(e){
    if(e.target === $('textChartModal')){
      $('textChartModal').classList.remove('show');
    }
  });

  $('textChartOk').addEventListener('click', function(){
    const p = getProject(currentId);
    if(p && textChartRow){
      const val = $('textChartInput').value.trim();
      if(!Array.isArray(p.charts)) p.charts = [];
      if(val){
        p.charts[textChartRow - 1] = { type: 'text', text: val };
      }else{
        p.charts[textChartRow - 1] = null;
      }
      saveData();
      renderChart();
      toast(val ? '已保存第 ' + textChartRow + ' 行图解 ✏️' : '已清除本行图解');
    }
    $('textChartModal').classList.remove('show');
  });

  $('textChartClear').addEventListener('click', function(){
    const p = getProject(currentId);
    if(p && textChartRow){
      if(!Array.isArray(p.charts)) p.charts = [];
      p.charts[textChartRow - 1] = null;
      saveData();
      renderChart();
      toast('已清除本行图解');
    }
    $('textChartModal').classList.remove('show');
  });

  $('textChartInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      $('textChartOk').click();
    }
  });

  $('plusBtn').addEventListener('click', function(){ changeRow(1); });
  $('minusBtn').addEventListener('click', function(){ changeRow(-1); });
  $('backBtn').addEventListener('click', goBackToList);
  $('saveBtn').addEventListener('click', function(){ saveCurrent(true); });

  let noteTimer = null;
  $('noteInput').addEventListener('input', function(){
    const p = getProject(currentId);
    if(p) p.note = $('noteInput').value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveData, 500);
  });

  $('newProjectBtn').addEventListener('click', openCreateModal);

  window.addEventListener('popstate', function(){
    if($('histTextChartModal').classList.contains('show')){
      $('histTextChartModal').classList.remove('show');
      return;
    }
    if($('histDetailModal').classList.contains('show')){
      closeHistDetail();
      return;
    }
    if($('detailPage').classList.contains('active')){
      goBackToList();
    }
  });
  history.replaceState({ page: 'list' }, '');

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && currentId) saveCurrent(false);
  });

  loadData();
  buildIconGrid();
  renderList();

})();
</script>
</body>
</html>
